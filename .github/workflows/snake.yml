name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: adi03-oist
          outputs: |
            dist/github-snake.svg?color_snake=%230FBF3E&color_dots=%23161B22%2C%230E4429%2C%23006D32%2C%2326A641%2C%2339D353
            dist/github-snake-dark.svg?color_snake=%230FBF3E&color_dots=%23161B22%2C%230E4429%2C%23006D32%2C%2326A641%2C%2339D353

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
